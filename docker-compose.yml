# Run any of the four language starters against a real Chroma instance,
# no local Node, Python, Go, or Rust install required.
#
# Quick start:
#   docker compose up -d chroma        # start Chroma in the background
#   docker compose run --rm javascript npm run rag -- "What is the C-Chain?"
#   docker compose run --rm python python rag.py "What is the C-Chain?"
#   docker compose run --rm golang ./rag "What is the C-Chain?"
#   docker compose run --rm rust ./rag "What is the C-Chain?"
#
# Session 6, the payment agent, works the same way (no Chroma needed):
#   docker compose run --rm javascript npm run payment-agent
#   docker compose run --rm python python payment_agent.py
#   docker compose run --rm golang ./payment-agent
#   docker compose run --rm rust ./payment_agent
#
# Session 7, connecting to a frontend:
#   docker compose up web              # the full Next.js app, http://localhost:3000
#   docker compose up python-api       # the FastAPI + SSE server, http://localhost:8001
#   docker compose up golang-api       # the net/http + SSE server, http://localhost:8002
#   docker compose up rust-api         # the axum + SSE server, http://localhost:8004
#
# Any of the other scripts work the same way, swap the command:
#   docker compose run --rm javascript npm run advisor -- <wallet-address>
#   docker compose run --rm golang ./direct-rpc
#
# Each service reads its own .env file, copy .env.example to .env in
# that language's folder first (and in javascript/web for the web
# service specifically), same as running locally.

services:
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  javascript:
    build: ./javascript
    volumes:
      - ./javascript:/app
      - javascript_node_modules:/app/node_modules
    env_file:
      - ./javascript/.env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      - chroma

  # The Session 7 Next.js app: frontend and API routes together, one
  # service, no separate backend, no CORS. This is genuinely the
  # recommended path, see the root README's Session 7 section.
  web:
    build: ./javascript/web
    ports:
      - "3000:3000"
    env_file:
      - ./javascript/web/.env
    profiles: ["web"]

  python:
    build: ./python
    volumes:
      - ./python:/app
    env_file:
      - ./python/.env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      - chroma

  # The Session 7 "separate backend" pattern in Python: run
  # `docker compose up python-api` for a long-lived server instead of
  # `docker compose run` for a one-off script.
  python-api:
    build: ./python
    command: uvicorn api_server:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - ./python/.env
    profiles: ["web"]

  golang:
    build: ./golang
    env_file:
      - ./golang/.env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      - chroma

  golang-api:
    build: ./golang
    command: ["./api-server"]
    ports:
      - "8002:8000"
    env_file:
      - ./golang/.env
    profiles: ["web"]

  rust:
    build: ./rust
    env_file:
      - ./rust/.env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      - chroma

  rust-api:
    build: ./rust
    command: ["./api_server"]
    ports:
      - "8004:8004"
    env_file:
      - ./rust/.env
    profiles: ["web"]

volumes:
  chroma_data:
  javascript_node_modules:
